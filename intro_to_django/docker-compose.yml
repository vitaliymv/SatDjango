version: "3.9"

services:
  web:
    build:
      context: .

    container_name: django_app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  celery:
    build:
      context: .
    container_name: celery_worker
    command: celery -A intro_to_django worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis

  celery-beat:
    build:
      context: .
    container_name: celery-beat
    command: celery -A intro_to_django beat --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis